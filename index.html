<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="lang-selector">
        <select id="languageSelect">
            <option value="tr" selected>Türkçe</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="bn">বাংলা</option>
            <option value="ur">اردو</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="vi">Tiếng Việt</option>
            <option value="th">ไทย</option>
            <option value="nl">Nederlands</option>
        </select>
    </div>

    <main class="container">
        <header>
            <h1 id="mainTitle">Decision <span class="highlight">AI</span></h1>
            <p id="mainSubtitle">Arada kalmak yok. Sadece tek ve net bir cevap.</p>
        </header>

        <section class="decision-section">
            <div class="topic-container" style="margin-bottom: 20px;">
                <input type="text" id="topicInput" class="glass-input topic-input" placeholder="Neye karar veriyoruz? (Örn: Bugün ne yesek?)">
            </div>

            <div class="options-container" id="optionsContainer">
                <!-- Inputs will be injected here by JS -->
            </div>
            
            <button id="decideBtn" class="full-width-btn">Karar Ver</button>
            
            <div class="result-box hidden" id="resultBox">
                <div class="loader hidden" id="loader"></div>
                <h2 id="answerText"></h2>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
